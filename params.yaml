# ===========================================================
# Pipeline Parameters — used by DVC stages and training scripts
# ===========================================================

seed: 42

data:
  data_dir: data
  profiles:
    profil_1_stable:
      - I23
      - I61
    profil_2_bimodal:
      - I42
      - I43
    profil_3_multi:
      - "52"
      - I11
      - I113
      - I32

preprocessing:
  fill_method: time
  idle_quantile: 0.25

windowing:
  window_size: 128
  step_size: 64

cwt:
  scales_min: 1
  scales_max: 65
  wavelet: morl

clustering:
  min_k: 2
  max_k: 5
  new_machine_file: ""

autoencoder:
  batch_size: 64
  epochs: 25
  learning_rate: 0.001
  anomaly_ratio_test: 0.2
  output_dir: results_autoencoder

contrastive:
  batch_size: 128
  epochs_pretrain: 30
  learning_rate: 0.0003
  temperature: 0.05
  embedding_dim: 128
  anomaly_ratio_test: 0.2
  output_dir: results_contrastive

fine_tuning:
  source_profile: profil_1_stable
  target_sensor: I42
  batch_size: 32
  epochs: 5
  learning_rate: 0.0001

transfer:
  source_profile: profil_1_stable
  target_sensor: I11
  batch_size: 32
  epochs: 5
  learning_rate: 0.0001

mlflow:
  tracking_uri: mlruns
  experiment_autoencoder: cwt-cnn-autoencoder
  experiment_contrastive: contrastive-1d
