stages:

  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - src/services/
      - data/
    params:
      - seed
      - data
      - preprocessing
    outs:
      - artifacts/preprocessed/
    metrics:
      - metrics/preprocessing_quality.json:
          cache: false

  clustering:
    cmd: python src/cluster_machine.py
    deps:
      - src/cluster_machine.py
      - src/services/
      - artifacts/preprocessed/
    params:
      - seed
      - clustering
      - preprocessing
    metrics:
      - metrics/clustering_metrics.json:
          cache: false

  train_autoencoder:
    cmd: python src/train_autoencoder.py
    deps:
      - src/train_autoencoder.py
      - src/services/
      - artifacts/preprocessed/
    params:
      - seed
      - data
      - windowing
      - cwt
      - autoencoder
      - mlflow
    outs:
      - results_autoencoder/
    metrics:
      - metrics/autoencoder_metrics.json:
          cache: false

  train_contrastive:
    cmd: python src/train_contrastive.py
    deps:
      - src/train_contrastive.py
      - src/services/
      - artifacts/preprocessed/
    params:
      - seed
      - data
      - windowing
      - contrastive
      - mlflow
    outs:
      - results_contrastive/
    metrics:
      - metrics/contrastive_metrics.json:
          cache: false

  evaluate:
    cmd: python src/evaluate_models.py
    deps:
      - src/evaluate_models.py
      - metrics/autoencoder_metrics.json
      - metrics/contrastive_metrics.json
    metrics:
      - metrics/model_comparison.json:
          cache: false

  validate:
    cmd: python src/validate.py
    deps:
      - src/validate.py
      - artifacts/preprocessed/
      - results_autoencoder/
      - results_contrastive/
    outs:
      - reports/deepchecks_data_report.html:
          cache: false
      - reports/deepchecks_model_report.html:
          cache: false
